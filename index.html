  <style id="char-photo-style">
  /* ảnh thay ô chữ cái trên thẻ */
  .avatar{position:relative;overflow:hidden}
  .avatar-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
  /* ảnh mờ ở khung SELECT CHARACTER */
  .hs-stage .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:blur(2px) brightness(.6) saturate(1.02);opacity:0;transition:opacity .45s ease;pointer-events:none;z-index:0}
  .hs-stage .hero-photo.on{opacity:1}
  .hs-stage.has-photo .hs-stage-mark,.hs-stage.has-photo .hs-stage-bgmark{opacity:0;transition:opacity .3s ease}
  .hs-hint{text-align:center;font-size:11.5px;color:var(--muted);margin:-6px 0 14px;opacity:.9}
  /* khung lớn nhân vật (giống khung hộp nhạc) */
  .cs-scrim{position:fixed;inset:0;z-index:9995;background:rgba(4,3,10,.66);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .cs-scrim.on{opacity:1;pointer-events:auto}
  .cs-sheet{position:fixed;left:0;right:0;bottom:0;z-index:9996;display:flex;flex-direction:column;
    max-height:88vh;max-width:620px;margin:0 auto;background:linear-gradient(180deg,#17142c,#0e0c1c);
    border-top:1px solid #3a3560;border-radius:22px 22px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.55);
    transform:translateY(102%);transition:transform .34s cubic-bezier(.2,0,.2,1);visibility:hidden}
  .cs-sheet.on{transform:translateY(0);visibility:visible}
  .cs-topbar{position:sticky;top:0;z-index:6;flex:0 0 auto;background:linear-gradient(180deg,#17142c 70%,rgba(23,20,44,.85));
    border-radius:22px 22px 0 0;padding-top:2px}
  .cs-grip{position:relative;width:64px;height:5px;border-radius:99px;background:#4a4470;margin:10px auto 10px;touch-action:none}
  .cs-grip::after{content:"vuốt xuống để đóng";position:absolute;left:50%;bottom:calc(100% + 5px);
    transform:translateX(-50%);font-size:9.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;pointer-events:none}
  .cs-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px;
    font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .cs-x{background:#221e3f;border:1px solid var(--line);color:var(--text);width:34px;height:34px;
    border-radius:12px;font-size:15px;line-height:1}
  .cs-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:26px}
  .cs-photo{position:relative;margin:0 16px;border-radius:16px;overflow:hidden;background:#0d0b18;
    display:grid;place-items:center;min-height:180px}
  /* NHIỀU ẢNH: lướt ngang trong khung lớn */
  .cs-slides{display:flex;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cs-slides::-webkit-scrollbar{display:none}
  .cs-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;display:grid;place-items:center;
    min-height:180px;overflow:hidden}
  .cs-slide-bg{position:absolute;inset:-14%;background-size:cover;background-position:center;
    filter:blur(20px) brightness(.5);transform:scale(1.15)}
  .cs-slide img{position:relative;z-index:1;max-width:100%;max-height:44vh;object-fit:contain;display:block}
  .cs-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:rgba(12,10,24,.62);color:var(--text);font-size:19px;line-height:1;
    display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .cs-nav-prev{left:8px} .cs-nav-next{right:8px}
  .cs-dots{position:absolute;left:0;right:0;bottom:8px;z-index:3;display:flex;justify-content:center;gap:5px;
    pointer-events:none}
  .cs-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.38);display:block;transition:width .2s,background .2s}
  .cs-dots i.on{background:#fff;width:16px;border-radius:99px}
  .cs-mark{font-family:'Playfair Display',serif;font-weight:800;font-size:64px;color:rgba(255,255,255,.9);z-index:1}
  .cs-info{padding:14px 16px 0}
  .cs-name{font-size:21px;font-weight:800;margin:2px 0 8px}
  .cs-tags{display:flex;flex-wrap:wrap;gap:6px}
  .cs-tag{font-size:11.5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--text)}
  .cs-quote{font-size:13.5px;line-height:1.6;color:var(--text);font-style:italic;margin:12px 0 14px;
    border-left:2px solid var(--accent);padding-left:10px;opacity:.92}
  .cs-acts{display:flex;gap:8px}
  .cs-acts .btn.primary{flex:1}
  .cs-wish{display:none;text-align:center;padding:12px 0 4px}
  .cs-wish b{display:block;font-size:20px;background:linear-gradient(135deg,#8b7bff,#4fc3ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .cs-wish span{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
  .cs-sheet.wishmode .cs-acts{display:none}
  .cs-sheet.wishmode .cs-wish{display:block}
  @media (max-width:420px){ .cs-sheet{max-height:86vh} .cs-photo{margin:0 12px} .cs-info{padding:12px 12px 0} }
  /* 12/10/2026: bản máy tính khung SELECT CHARACTER hơi thấp → nới cao cho ảnh đẹp hơn (điện thoại giữ nguyên) */

    /* 🪽 ô mới: 3 ô đều nhau */
    .profile-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  }

       Vấn đề gốc: các tag nhiều từ như "#Hiện đại" / "#Cổ trang" chứa khoảng trắng bên trong,
       nên logic tách tag cũ (theo khoảng trắng) đã cắt gãy chúng thành 2 tag rời rạc.
       => parseTags() tách đúng từng tag hoàn chỉnh (từ dấu # đến trước dấu # kế tiếp).
       => tagFlags()/classifyChar() dùng alias xây từ tag THỰC TẾ trong dữ liệu để gom nhóm,
          không suy đoán/không dùng contains() tràn lan. */
    function parseTags(tagStr){
      return (String(tagStr||'').match(/#[^#]+/g) || []).map(t => t.trim()).filter(Boolean);
    }
    // Chuẩn hóa 1 tag để so sánh: bỏ dấu #, chuẩn hóa Unicode NFC, viết thường,
    // coi gạch dưới/gạch nối như khoảng trắng, gộp khoảng trắng thừa
    function normalizeTagToken(raw){
      return String(raw || '')
        .normalize('NFC')
        .trim()
        .replace(/^#+/, '')
        .toLowerCase()
        .replace(/[_\-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }
    // Dạng "nén" — bỏ hết khoảng trắng, dùng để so khớp biến thể viết liền/viết cách (VD "Cổ trang" ~ "CổTrang")
    function compactTag(normalizedTag){ return normalizedTag.replace(/\s+/g, ''); }

    // Cờ phân loại cho 1 tag đơn lẻ, dựa trên alias xây từ tag thực tế đang có trong dữ liệu:
    // - HIỆN ĐẠI: "Hiện đại", "Hiện đại Châu Âu"...
    // - CỔ TRANG: "Cổ trang", "CổTrang", "CổTrangAOB", "Cổ đại", "Tu tiên", "Cung đấu", "Tu chân tiên hiệp"...
    // - AOB: "AOB", "ABO", "Alpha"/"Beta"/"Omega" đứng riêng, hoặc ký hiệu ghép cặp kiểu
    //   "A x A", "O x E", "A x E x O", "AlphaXAlpha"...

    // Danh sách alias [Cổ trang] — mỗi alias là 1 cụm từ đã chuẩn hóa (mảng các từ theo đúng thứ tự).
    // Chỉ gồm đúng các cụm được yêu cầu gộp nhóm, không tự ý thêm cụm khác.
    const ANCIENT_ALIAS_PHRASES = [
      ['cổ', 'trang'],
      ['cổ', 'đại'],
      ['tu', 'tiên'],
      ['cung', 'đấu'],
      ['tu', 'chân', 'tiên', 'hiệp'],
    ];
    // So khớp 1 tag (đã tách từ + nén) với 1 alias-phrase: hỗ trợ cả dạng viết cách (khớp đúng thứ tự
    // từng từ đầu) lẫn dạng viết liền không dấu cách (khớp phần đầu chuỗi đã nén) — không dùng contains() mơ hồ.
    function matchesAliasPhrase(words, compact, phraseWords){
      const wordMatch = phraseWords.every((w, idx) => words[idx] === w);
      const compactMatch = compact.startsWith(phraseWords.join(''));
      return wordMatch || compactMatch;
    }

    function tagFlags(rawTagToken){
      const norm = normalizeTagToken(rawTagToken);
      const compact = compactTag(norm);
      const words = norm.split(' ').filter(Boolean);
      const flags = { modern: false, ancient: false, aob: false };

      if (compact === 'aob' || compact === 'abo') flags.aob = true;
// Nhận diện AOB nằm cuối tag ghép, VD: "ThúNhânAOB", "CổTrangAOB"
      if (compact.endsWith('aob') || compact.endsWith('abo')) flags.aob = true;
      if (compact === 'alpha' || compact === 'beta' || compact === 'omega') flags.aob = true;
      if (/^(alpha|beta|omega|[aboe])(x(alpha|beta|omega|[aboe]))+$/.test(compact)) flags.aob = true;

      if ((words[0] === 'hiện' && words[1] === 'đại') || compact.startsWith('hiệnđại')) {
        flags.modern = true;
      }

      if (ANCIENT_ALIAS_PHRASES.some(phrase => matchesAliasPhrase(words, compact, phrase))) {
        flags.ancient = true;
        // Tag ghép thực tế "CổTrangAOB" => vừa Cổ trang vừa AOB
        if (compact.startsWith('cổtrang')) {
          const suffix = compact.slice('cổtrang'.length);
          if (suffix === 'aob' || suffix === 'abo') flags.aob = true;
        }
      }

      return flags;
    }

    // Phân loại 1 Character: thể loại chính (Hiện đại / Cổ trang / Khác) + cờ AOB (không loại trừ lẫn nhau)
    function classifyChar(item){
      const tags = parseTags(item.tag);
      let hasModern = false, hasAncient = false, hasAob = false;
      tags.forEach(t => {
        const f = tagFlags(t);
        if (f.modern) hasModern = true;
        if (f.ancient) hasAncient = true;
        if (f.aob) hasAob = true;
      });
      let primary = 'khác';
      if (hasModern && !hasAncient) primary = 'hiện đại';
      else if (hasAncient && !hasModern) primary = 'cổ trang';
      // Có cả 2 mà không có quy tắc ưu tiên rõ ràng trong dữ liệu => Khác (không đoán bừa)
      return { hasModern, hasAncient, hasAob, primary };
    }

    // So khớp Character với 1 giá trị filter: hỗ trợ filter theo nhóm thể loại chính (genre:...)
    // lẫn filter theo tag thô như "#WLW" (giữ nguyên hành vi cũ cho các tag không thuộc 2 nhóm chính)
    function matchesFilter(item, filterVal){
      if (filterVal === 'all') return true;
      if (filterVal === 'genre:aob') return classifyChar(item).hasAob;
      if (filterVal === 'genre:hiện đại') return classifyChar(item).primary === 'hiện đại';
      if (filterVal === 'genre:cổ trang') return classifyChar(item).primary === 'cổ trang';
      if (filterVal === 'genre:khác') return classifyChar(item).primary === 'khác';
      if (filterVal === 'liked')  return likedSet.has(item.name);
      if (filterVal === 'pinned') return pinnedLocal.includes(item.name);
      return parseTags(item.tag).some(t => t === filterVal);
    }

    // Nhãn hiển thị thân thiện cho trạng thái filter đang chọn
    function filterLabel(v){
      const map = { 'all': 'tất cả nhóm', '#WLW': '#WLW', 'genre:aob': 'AOB', 'genre:hiện đại': 'Hiện đại', 'genre:cổ trang': 'Cổ trang', 'genre:khác': 'Khác', 'liked': '❤️ Yêu thích', 'pinned': '📌 Đã ghim' };
      return map[v] || v;
    }

    // Tìm theo từ khóa/tag tự do (Tầng 2): chấp nhận có/không dấu #, hoa/thường, viết liền/viết cách
    function textMatches(item, rawQuery){
      const q = normalizeTagToken(rawQuery);
      if (!q) return true;
      const qCompact = compactTag(q);
      const plain = normalize(item.name) + ' ' + normalize(item.summary || '') + ' ' + normalize(item.extra || '');
      if (plain.includes(q)) return true;
      return parseTags(item.tag).some(t => {
        const nt = normalizeTagToken(t);
        if (nt.includes(q)) return true;
        return compactTag(nt).includes(qCompact);
      });
    }

    function avatarText(name){
      const parts = String(name||'').trim().split(/[\s·&]+/).filter(Boolean);
      if(!parts.length) return '?';
      const ini = w => (w[0]||'').toUpperCase();
      return parts.length===1 ? ini(parts[0]) : ini(parts[0]) + ini(parts[parts.length-1]);
    }
    function getMonday(d){
      const date = new Date(d); const day = date.getDay();
      const diff = (day+6)%7;
      date.setDate(date.getDate()-diff); date.setHours(0,0,0,0);
      return date;
    }
    function getWeekKey(d){
      const monday = getMonday(d);
      const firstJan = new Date(monday.getFullYear(),0,1);
      const days = Math.floor((monday-firstJan)/(24*60*60*1000));
      const week = Math.ceil((days+firstJan.getDay()+1)/7);
      return `${monday.getFullYear()}-W${String(week).padStart(2,'0')}`;
    }
    function formatWeekLabel(monday){
      const sun = new Date(monday); sun.setDate(sun.getDate()+6);
      const fmt = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
      return `${fmt(monday)} – ${fmt(sun)}`;
    }
    function getCountdown(monday){
      const next = new Date(monday); next.setDate(next.getDate()+7);
      const diff = next - new Date();
      const d = Math.floor(diff/(1000*60*60*24));
      const h = Math.floor((diff/(1000*60*60))%24);
      return `${d} ngày ${h} giờ`;
    }
    const WEEK_KEY = getWeekKey(new Date());
    const WEEK_MONDAY = getMonday(new Date());

    async function initSupabase(){
      if(!SUPABASE_URL || !SUPABASE_ANON_KEY){ setCloud(false,'📴 Chưa cấu hình Supabase'); return false; }
      try {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          setCloud(false, '📴 Chưa tải thư viện Supabase');
          return false;
        }
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{persistSession:false} });
        const rowsOk  = await ensureWeekRows();
        const fetchOk = await fetchStats();
        if(!fetchOk){
          // Kết nối được client nhưng KHÔNG truy vấn được (project pause/xoá, sai key, mất mạng...)
          supabaseClient = null;
          setCloud(false, rowsOk ? '⚠️ Supabase trả lỗi – đang dùng dữ liệu cục bộ' : '📴 Không kết nối được Supabase – dùng dữ liệu cục bộ');
          return false;
        }
        setCloud(true);
        return true;
      } catch(err){
        console.warn('Supabase init failed:',err);
        setCloud(false,'⚠️ Lỗi kết nối – dùng dự phòng cục bộ');
        supabaseClient = null;
        return false;
      }
    }
    async function ensureWeekRows(){
      if(!supabaseClient) return false;
      const rows = chars.map(c => ({week_key:WEEK_KEY, char_name:c.name, hearts:0,copies:0,pins:0}));
      try {
        const {error} = await supabaseClient.from('char_stats').upsert(rows, {onConflict:'week_key,char_name', ignoreDuplicates:true});
        if(error) throw error;
        return true;
      } catch(e){ console.warn('ensureWeekRows failed:',e); return false; }
    }
    async function fetchStats(){
      if(!supabaseClient) return;
      try {
        const {data,error} = await supabaseClient.from('char_stats').select('char_name,hearts,copies,pins').eq('week_key',WEEK_KEY);
        if(error) throw error;
        if(data && data.length){
          const merged = defaultStats();
          data.forEach(r => { if(merged[r.char_name]) merged[r.char_name] = {hearts:r.hearts||0,copies:r.copies||0,pins:r.pins||0}; });
          statsData = merged;
        }
        return true;                       // kết nối + truy vấn thành công
      } catch(e){
        console.warn('fetchStats failed:',e);
        return false;                      // mất mạng / bảng chưa tạo / project bị pause
      }
    }
    async function bumpStatRemote(name,field,delta){
      if(!supabaseClient) return false;
      try {
        const {error} = await supabaseClient.rpc('increment_stat',{wk:WEEK_KEY,cn:name,fld:field,d:delta});
        if(error) throw error;
        return true;
      } catch(e){
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/char_stats?week_key=eq.${encodeURIComponent(WEEK_KEY)}&char_name=eq.${encodeURIComponent(name)}`,{
            method:'PATCH',
            headers:{
              'apikey':SUPABASE_ANON_KEY,
              'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type':'application/json',
              'Prefer':'return=minimal'
            },
            body: JSON.stringify({[field]: (statsData[name]?.[field]||0)+delta})
          });
          return res.ok;
        } catch(e2){ return false; }
      }
    }
    function charStats(name){ return statsData[name]||{hearts:0,copies:0,pins:0}; }
    function totalStats(){ let h=0,c=0,p=0; Object.values(statsData).forEach(s=>{h+=s.hearts||0;c+=s.copies||0;p+=s.pins||0;}); return {hearts:h,copies:c,pins:p}; }

    function loadLocalPrefs(){

      try { likedSet = new Set(JSON.parse(localStorage.getItem(key)||'[]')); } catch { likedSet = new Set(); }
      try { pinnedLocal = JSON.parse(localStorage.getItem('pinnedChars'))||[]; } catch { pinnedLocal=[]; }
    }
    function saveLiked(){ safeSet(`liked_${WEEK_KEY}`, JSON.stringify([...likedSet])); }
    function savePinned(){ safeSet('pinnedChars', JSON.stringify(pinnedLocal)); }
    function updateLocalStat(name,field,delta){
      if(!statsData[name]) statsData[name]={hearts:0,copies:0,pins:0};
      statsData[name][field] = Math.max(0,(statsData[name][field]||0)+delta);
    }

    let toastTimeout=null,toastEl=$('#toast');

    async function doCopy(name,link){
      updateLocalStat(name,'copies',1);
      if(supabaseClient) bumpStatRemote(name,'copies',1).then(ok=>{if(ok)fetchStats().then(refreshUI);});
      try { await navigator.clipboard.writeText(link); showToast('✅ Đã copy link!'); }
      catch { showToast('❌ Không copy được',2500); }
      refreshUI();

    async function toggleHeart(name){
      const wasLiked = likedSet.has(name); const delta = wasLiked?-1:1;
      if(wasLiked) likedSet.delete(name); else likedSet.add(name);
      saveLiked(); updateLocalStat(name,'hearts',delta); refreshUI();
      if(supabaseClient){ const ok=await bumpStatRemote(name,'hearts',delta); if(ok) fetchStats().then(refreshUI); }
      showToast(wasLiked?`🤍 Bỏ tim ${name}`:`❤️ Đã tim ${name}`);
    }
    async function togglePin(name){
      const idx=pinnedLocal.indexOf(name);
      if(idx!==-1){
        pinnedLocal.splice(idx,1); savePinned(); updateLocalStat(name,'pins',-1);
        showToast(`📌 Đã bỏ ghim ${name}`);
        if(supabaseClient) bumpStatRemote(name,'pins',-1).then(ok=>ok?fetchStats().then(refreshUI):null);
      } else {
        if(pinnedLocal.length>=3){ showToast('⚠️ Tối đa 3 ghim!',2500); return; }
        pinnedLocal.push(name); savePinned(); updateLocalStat(name,'pins',1);
        showToast(`📌 Đã ghim ${name}`);
        if(supabaseClient) bumpStatRemote(name,'pins',1).then(ok=>ok?fetchStats().then(refreshUI):null);
      }
      refreshUI();
    }

    /* SELECT CHARACTER CAROUSEL */
    function shadeColor(hex, percent){
      let c=(hex||'#a78bfa').replace('#','');
      if(c.length===3) c=c.split('').map(x=>x+x).join('');
      const num=parseInt(c,16)||0xa78bfa;
      let r=(num>>16)&255,g=(num>>8)&255,b=num&255;
      const t=percent<0?0:255, p=Math.abs(percent);
      r=Math.round((t-r)*p)+r; g=Math.round((t-g)*p)+g; b=Math.round((t-b)*p)+b;
      return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1);
    }

    const csSheetEl=$('#csSheet'), csScrimEl=$('#csScrim');
    let csIsOpen=false, csOpenedAt=0, csTimer=null, csSeq=0;

    /* tìm các ảnh của 1 nhân vật: pic001.jpg (bìa) rồi pic001_2.jpg, pic001_3.jpg… dừng ở tấm đầu tiên bị thiếu
       (nếu không có ảnh bìa thì bắt đầu từ pic001_1.jpg). Kết quả được nhớ lại, không dò lại từ đầu. */
    function csProbe(name, ok, fail){
      const a=new Image();
      a.onload=()=>ok(CS_DIR+name);
      a.onerror=()=>{ const b=new Image(); b.onload=()=>ok(name); b.onerror=fail; b.src=name; };
      a.src=CS_DIR+name;
    }
    function imgsFor(i, cb){
      const c=chars[i]; if(!c){ cb([]); return; }
      if(c.__imgs){ cb(c.__imgs); return; }
      const base=picBase(i), ex=picExt(i), list=[];
      const done=()=>{ c.__imgs=list; cb(list); };
      const findOne=(nm, yes, no)=>{ let k=0; const step=()=>{ if(k>=ex.length){ no(); return; } csProbe(nm+ex[k++], yes, step); }; step(); };
      const more=k=>{ if(k>12){ done(); return; }
        findOne(base+'_'+k, src=>{ list.push(src); more(k+1); }, done); };
      findOne(base, src=>{ list.push(src); more(2); },
              ()=>findOne(base+'_1', src=>{ list.push(src); more(2); }, done));
    }
    function csDots(k){ const d=$('#csDots'); if(d) [...d.children].forEach((el,i)=>el.classList.toggle('on',i===k)); }
    function csRender(list){
      const sl=$('#csSlides'), mk=$('#csMark'), dots=$('#csDots'), pv=$('#csPrev'), nx=$('#csNext'), ph=$('#csPhoto');
      csList=list; csIdx=0;
      if(!list.length){ sl.innerHTML=''; dots.hidden=true; pv.hidden=true; nx.hidden=true; mk.style.display='grid'; return; }
      mk.style.display='none'; ph.style.background='#0d0b18';
      sl.innerHTML=list.map((src,k)=>'<div class="cs-slide"><div class="cs-slide-bg" style="background-image:url(\''+src+'\')"></div>'+
        '<img src="'+src+'" alt="" decoding="async" loading="'+(k?'lazy':'eager')+'"></div>').join('');
      sl.scrollLeft=0;
      const many=list.length>1;
      dots.hidden=!many; pv.hidden=!many; nx.hidden=!many;
      dots.innerHTML=many?list.map((_,k)=>'<i class="'+(k?'':'on')+'"></i>').join(''):'';
    }
    function csGo(k){ const sl=$('#csSlides'); if(!csList.length) return;
      csIdx=Math.max(0,Math.min(k,csList.length-1));
      sl.scrollTo({left:csIdx*sl.clientWidth, behavior:'smooth'}); csDots(csIdx); }
    $('#csSlides').addEventListener('scroll',()=>{ const sl=$('#csSlides'); if(csList.length<2) return;
      const k=Math.round(sl.scrollLeft/sl.clientWidth); if(k!==csIdx){ csIdx=k; csDots(k); } },{passive:true});
    $('#csPrev').addEventListener('click',e=>{ e.stopPropagation(); csGo(csIdx-1); });
    $('#csNext').addEventListener('click',e=>{ e.stopPropagation(); csGo(csIdx+1); });

    function csFill(item, i){
      const a=item.accent||'#8b7bff', a2=shadeColor(a,-0.55);

      imgsFor(i, list=>{ if(tok===csSeq) csRender(list); });
      $('#csName').textContent=item.name;
      $('#csTags').innerHTML=parseTags(item.tag).map(t=>'<span class="cs-tag">'+escapeHtml(t)+'</span>').join('');
      $('#csQuote').textContent='“'+(item.summary||'')+'”';
      const il=likedSet.has(item.name), ip=pinnedLocal.includes(item.name);
      $('#csActs').innerHTML=
        '<a class="btn primary" href="'+item.link+'" target="_blank" rel="noopener">Mở Character ↗</a>'+
        '<button class="btn icon-btn heart-btn '+(il?'liked':'')+'" data-action="heart" data-name="'+escapeHtml(item.name)+'" title="Yêu thích">'+(il?'❤️':'🤍')+'</button>'+
        '<button class="btn icon-btn" onclick=\'doCopy('+JSON.stringify(item.name)+','+JSON.stringify(item.link)+')\' title="Copy link">📋</button>'+
        '<button class="btn icon-btn pin-btn '+(ip?'pinned':'')+'" data-action="pin" data-name="'+escapeHtml(item.name)+'" '+(pinnedLocal.length>=3&&!ip?'disabled':'')+' title="Ghim">📌</button>';
    }
    function csOpenAs(i, wishMode){
      const item=chars[i]; if(!item) return;
      /* 12/10/2026: phải MỞ khung trước rồi mới vẽ ảnh.
         Nếu vẽ trước, cờ csIsOpen còn false → ảnh không hiện khi mở lại nhân vật (bị hiện chữ cái). */
      csIsOpen=true; csOpenedAt=Date.now();
      csSheetEl.classList.toggle('wishmode',!!wishMode);
      csSheetEl.classList.add('on'); csScrimEl.classList.add('on');
      csSheetEl.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
      if(csTimer){ clearTimeout(csTimer); csTimer=null; }
            if(wishMode) csTimer=setTimeout(()=>{ if(csIsOpen) window.location.href=item.link; },6000);   /* 🎲 hết 6 giây → chuyển thẳng sang link character */
      csFill(item, i);
    }
    function csClose(){
      csIsOpen=false;
      if(csTimer){ clearTimeout(csTimer); csTimer=null; }
      csSheetEl.classList.remove('on'); csScrimEl.classList.remove('on');
      csSheetEl.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
      csSheetEl.style.transition=''; csSheetEl.style.transform='';
    }
    /* nuốt "click ảo" ~300ms sau khi mở — mẹo đã sửa cho hộp nhạc */
    document.addEventListener('click',e=>{ if(csIsOpen&&Date.now()-csOpenedAt<700){ e.stopPropagation(); e.preventDefault(); } },true);
    csScrimEl.addEventListener('click',()=>{ if(Date.now()-csOpenedAt>700) csClose(); });
    $('#csClose').addEventListener('click',csClose);
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&csIsOpen) csClose(); });
    attachG($('#csActs'));
    (function(){
      const g=$('#csGrip'); let y0=null, dy=0;
      g.addEventListener('pointerdown',e=>{ y0=e.clientY; dy=0; try{g.setPointerCapture(e.pointerId);}catch(_){} });
      g.addEventListener('pointermove',e=>{ if(y0==null) return; dy=e.clientY-y0;
        if(dy>0){ csSheetEl.style.transition='none'; csSheetEl.style.transform='translateY('+dy+'px)'; } });
      const fin=()=>{ if(y0==null) return; const d=dy; y0=null; dy=0;
        csSheetEl.style.transition=''; csSheetEl.style.transform=''; if(d>70) csClose(); };
      g.addEventListener('pointerup',fin); g.addEventListener('pointercancel',fin);
      g.addEventListener('click',e=>{ e.stopPropagation(); csClose(); });
    })();
    if(window.console) console.log('🏞️ Ảnh nhân vật: đã bật (12/10/2026 · sửa lỗi mở lại mất ảnh) · chars/pic001.jpg … pic120.jpg');

    function heroTagLine(tagStr){
      const tags = parseTags(tagStr);
      return tags.slice(0,3).map(t=>t.replace(/^#/,'').replace(/_/g,' ').toUpperCase()).join(' · ');
    }
    let heroIndex = Math.max(0, chars.findIndex(c=>c.name==='Lâm Sơ Yến'));
    (function(){ const sv=parseInt(safeGet('skyHeroIndex')||'',10); if(!isNaN(sv)&&sv>=0&&sv<chars.length) heroIndex=sv; })();
    function renderHero(){
      const item=chars[heroIndex]; if(!item) return;
      const a=item.accent||'#a78bfa', a2=shadeColor(a,-0.55);
      $('#heroName').textContent=item.name;
      $('#heroMark').textContent=avatarText(item.name);
      const heroBg=$('#heroMarkBg'); if(heroBg) heroBg.textContent=avatarText(item.name);
      $('#heroStage').style.background=`linear-gradient(155deg, ${a} 0%, ${a2} 100%)`;
      stagePhoto(item);
      $('#heroTags').textContent=heroTagLine(item.tag);
      $('#heroOpenBtn').href=item.link;
      $('#heroCounter').textContent=`${String(heroIndex+1).padStart(2,'0')} / ${chars.length}`;
      const peek=[1,2,3].map(o=>chars[(heroIndex+o)%chars.length]);
      $('#heroPeek').innerHTML=peek.map(c=>`<button type="button" class="hs-peek-item" data-name="${escapeHtml(c.name)}">○ ${escapeHtml(c.name)}</button>`).join('');
    }
    function heroGo(delta){ heroIndex=(heroIndex+delta+chars.length)%chars.length; renderHero(); safeSet('skyHeroIndex',String(heroIndex)); }
    function heroGoTo(name){ const idx=chars.findIndex(c=>c.name===name); if(idx!==-1){ heroIndex=idx; renderHero(); safeSet('skyHeroIndex',String(heroIndex)); } }
    $('#heroPeek').addEventListener('click',e=>{
      const b=e.target.closest('.hs-peek-item'); if(!b)return;
      heroGoTo(b.dataset.name);
    });
    (function(){
      let tX=null; const st=$('#heroStage');
      st.addEventListener('touchstart',e=>{tX=e.touches[0].clientX;},{passive:true});
      st.addEventListener('touchend',e=>{
        if(tX==null)return;
        const dx=e.changedTouches[0].clientX-tX;
        if(Math.abs(dx)>40) heroGo(dx<0?1:-1);
        tX=null;
      },{passive:true});
    })();
    function stagePhoto(item){
      const st=$('#heroStage'); if(!st) return;
      let im=st.querySelector('.hero-photo');
      if(!item||!item.__img){ if(im) im.remove(); st.classList.remove('has-photo'); return; }
      if(!im){ im=document.createElement('img'); im.className='hero-photo'; im.alt=''; im.decoding='async';
               st.insertBefore(im, st.firstChild); }
      im.setAttribute('data-c', item.__cands||''); im.setAttribute('data-k','1');
      im.onerror=()=>{ if(window.__imgStep(im)) return; im.classList.remove('on'); st.classList.remove('has-photo'); };
      im.onload =()=>{ im.classList.add('on');    st.classList.add('has-photo'); };
      if(im.getAttribute('data-src')!==item.__img){ im.setAttribute('data-src',item.__img); im.src=item.__img; }
    }

    /* ================= RANDOM HORIZONTAL SPIN ================= */
    let isSpinning = false;
    function shadeColorSpin(hex, percent){
      let c=(hex||'#a78bfa').replace('#','');
      if(c.length===3) c=c.split('').map(x=>x+x).join('');
      const num=parseInt(c,16)||0xa78bfa;
      let r=(num>>16)&255,g=(num>>8)&255,b=num&255;
      const t=percent<0?0:255, p=Math.abs(percent);
      r=Math.round((t-r)*p)+r; g=Math.round((t-g)*p)+g; b=Math.round((t-b)*p)+b;
      return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1);
    }
    function startRandomSpin(){
      if(isSpinning || !chars.length) return;
      isSpinning = true;
      const heroSelect = document.querySelector('.hero-select');
      const stage = $('#heroStage');
      const wishEl = $('#heroWish');
      const openBtn = $('#heroOpenBtn');
      if(wishEl){ wishEl.textContent=''; wishEl.classList.remove('show'); }
      if(heroSelect) heroSelect.classList.add('spinning');
      stage.classList.add('spin-mode');
      const hr = $('#heroRandomBtn');
      if(hr){ hr.disabled = true; hr.style.opacity = '0.6'; }

      // Scroll featured into view
      const featured = $('#featured');
      if(featured) featured.scrollIntoView({behavior:'smooth', block:'center'});

      // Build a long strip of random chars for the spin
      const targetIndex = Math.floor(Math.random() * chars.length);
      const target = chars[targetIndex];
      const stripLen = 40 + Math.floor(Math.random() * 12); // total items in track
      const stopAt = stripLen - 4; // land near end
      const strip = [];
      for(let i=0; i<stripLen; i++){
        if(i === stopAt) strip.push(target);
        else strip.push(chars[Math.floor(Math.random()*chars.length)]);
      }

      // Create track
      stage.innerHTML = '';
      const track = document.createElement('div');
      track.className = 'hs-spin-track';
      strip.forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'hs-spin-item' + (i === 0 ? ' center' : '');
        item.style.setProperty('--spin-a', c.accent || '#a78bfa');
        item.style.setProperty('--spin-b', shadeColorSpin(c.accent || '#a78bfa', -0.55));
        item.innerHTML = '<span class="hs-spin-mark">'+escapeHtml(avatarText(c.name))+'</span><span class="hs-spin-name">'+escapeHtml(c.name)+'</span>';
        track.appendChild(item);
      });
      stage.appendChild(track);
      // Force layout so measurements are accurate
      void track.offsetWidth;

      // Measure
      const stageW = stage.clientWidth || 300;
      const firstItem = track.children[0];
      const itemStyle = firstItem ? getComputedStyle(firstItem) : null;
      const gap = 16;
      const itemW = firstItem ? (firstItem.offsetWidth + gap) : 136;
      // Center the stop item under the stage midpoint
      const targetOffset = Math.max(0, stopAt * itemW - (stageW / 2) + (itemW / 2));

      // Animate with requestAnimationFrame + ease-out
      const duration = 3200 + Math.random() * 800; // ~3.2–4s
      const start = performance.now();
      let lastCenter = -1;

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

      function frame(now){
        const t = Math.min(1, (now - start) / duration);
        const eased = easeOutCubic(t);
        const x = -targetOffset * eased;
        track.style.transform = 'translateX(' + x + 'px)';

        // Highlight center item
        const centerX = stageW / 2;
        let closest = 0, closestDist = Infinity;
        for(let i=0; i<track.children.length; i++){
          const el = track.children[i];
          const rect = el.getBoundingClientRect();
          const stageRect = stage.getBoundingClientRect();
          const mid = rect.left + rect.width/2 - stageRect.left;
          const dist = Math.abs(mid - centerX);
          if(dist < closestDist){ closestDist = dist; closest = i; }
        }
        if(closest !== lastCenter){
          if(lastCenter >= 0 && track.children[lastCenter]) track.children[lastCenter].classList.remove('center');
          if(track.children[closest]) track.children[closest].classList.add('center');
          lastCenter = closest;
          // Live update name while spinning (optional feedback)
          const live = strip[closest];
          if(live){
            $('#heroName').textContent = live.name;
            $('#heroTags').textContent = heroTagLine(live.tag);
            $('#heroCounter').textContent = String(closest+1).padStart(2,'0') + ' / ' + strip.length;
          }
        }

        if(t < 1){
          requestAnimationFrame(frame);
        } else {
          // Final settle on target
          track.style.transform = 'translateX(' + (-targetOffset) + 'px)';
          Array.from(track.children).forEach((el,i)=>el.classList.toggle('center', i===stopAt));
          heroIndex = targetIndex;
          safeSet('skyHeroIndex', String(targetIndex));
          // Update surrounding UI (stage still shows spin track with winner centered)
          $('#heroName').textContent = target.name;
          stage.style.background = 'linear-gradient(155deg, '+(target.accent||'#a78bfa')+' 0%, '+shadeColor(target.accent||'#a78bfa',-0.55)+' 100%)';
          $('#heroTags').textContent = heroTagLine(target.tag);
          openBtn.href = target.link;
          $('#heroCounter').textContent = String(heroIndex+1).padStart(2,'0') + ' / ' + chars.length;
          const peek=[1,2,3].map(o=>chars[(heroIndex+o)%chars.length]);
          $('#heroPeek').innerHTML = peek.map(c=>'<button type="button" class="hs-peek-item" data-name="'+escapeHtml(c.name)+'">○ '+escapeHtml(c.name)+'</button>').join('');

          // Sau khi ngừng quay: hiện KHUNG LỚN + câu chúc (tự đóng sau 6 giây)
          setTimeout(() => {
            stage.classList.remove('spin-mode');
            stage.innerHTML = '<span class="hs-stage-bgmark" id="heroMarkBg" aria-hidden="true">'+escapeHtml(avatarText(target.name))+'</span><span class="hs-stage-mark" id="heroMark">'+escapeHtml(avatarText(target.name))+'</span>';
            if(heroSelect) heroSelect.classList.remove('spinning');
            const hr2 = $('#heroRandomBtn');
            if(hr2){ hr2.disabled = false; hr2.style.opacity = ''; }
            isSpinning = false;
            stagePhoto(target);
            renderHero(); csOpenAs(heroIndex, true);
          }, 1600);
        }
      }
      requestAnimationFrame(frame);
    }

    function openRandom(){ startRandomSpin(); }
    $('#heroRandomBtn').addEventListener('click',openRandom);

    $('#heroStage').addEventListener('click',()=>{ if(!isSpinning) csOpenAs(heroIndex,false); });

    window.__pageRefresh = function(){ if(csIsOpen){ const it=chars[heroIndex]; if(it) csFill(it, heroIndex); } };
    initStatsData();loadLocalPrefs();renderHero();
    initSupabase();
  </script>
  <script id="sky-js">
  /* ═══ BẦU TRỜI & CHIM · tương tác mobile ═══ (TRANG 1 · SELECT CHARACTER) */
  (function(){
    const body=document.body;

    /* --- phụ trợ Select: chip, slogan, nền lùi, chấm --- */
    function selExtras(){
      const item=chars[heroIndex]; if(!item) return;
      const nx=chars[(heroIndex+1)%chars.length], a=(nx.accent||'#6FC3EC');
      const g='linear-gradient(155deg,'+a+','+shadeColor(a,-0.4)+')';
      const ch=$('#selChips'); if(ch) ch.innerHTML=parseTags(item.tag).slice(0,3).map(t=>'<span>'+escapeHtml(t.replace(/^#/,'').replace(/_/g,' '))+'</span>').join('');
      const sg=$('#selSlogan'); if(sg) sg.textContent=item.summary||'';
      const bk=$('#selBack'); if(bk) bk.style.backgroundImage=(nx.__img?'url("'+nx.__img+'"),':'')+g;
      const dots=$('#selDots'); if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle('on',i<=heroIndex%3));
      $('#heroCounter').textContent=(heroIndex+1)+' / '+chars.length;
    }
    const _rh=renderHero;
    window.renderHero=function(){ _rh(); selExtras(); };
    selExtras();

    /* --- thẻ bài vuốt DỌC: lên = kế tiếp, xuống = trước (không còn nút ⤴ ⤵) --- */
    const card=$('#selCard'), deck=$('#selDeck');
    let y0=0, dy=0, t0=0, drag=false, moved=false, busy=false;
    function swap(d){
      if(busy||isSpinning) return; busy=true;
      card.classList.add(d>0?'out-up':'out-down');
      setTimeout(function(){
        card.style.removeProperty('--dy');
        heroGo(d);
        card.classList.remove('out-up','out-down');
        card.classList.add(d>0?'in-up':'in-down');
        void card.offsetWidth;
        requestAnimationFrame(function(){ card.classList.remove('in-up','in-down'); setTimeout(function(){ busy=false; },280); });
      },230);
    }
    card.addEventListener('pointerdown',function(e){
      if(busy||isSpinning||(e.pointerType==='mouse'&&e.button>0)) return;
      drag=true; moved=false; y0=e.clientY; dy=0; t0=performance.now(); card.classList.add('drag');
    });
    window.addEventListener('pointermove',function(e){
      if(!drag) return; dy=e.clientY-y0; if(Math.abs(dy)>8) moved=true;
      card.style.setProperty('--dy',(dy*.55)+'px');
    });
    function endDrag(){
      if(!drag) return; drag=false; card.classList.remove('drag');
      const v=Math.abs(dy)/Math.max(1,performance.now()-t0);
      if(moved&&(Math.abs(dy)>60||v>.5)) swap(dy<0?1:-1); else card.style.removeProperty('--dy');
    }
    window.addEventListener('pointerup',endDrag);
    window.addEventListener('pointercancel',endDrag);
    card.addEventListener('click',function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
    /* phím mũi tên vẫn đổi nhân vật được */
    deck.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); swap(1); }
      else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); swap(-1); }
    });
    /* "Thư viện ⌄" → CHUYỂN TRANG sang thu-vien.html */
    $('#selToLib').addEventListener('click',function(){ location.href='thu-vien.html'; });

    /* --- MÀN 1: GHÉ VÔ → chim bay + thanh xanh 0→100% (~1.6s) → fade vào Select --- */
    const sp=$('#splash');
    function seen(){ try{ return sessionStorage.getItem('skySplash')==='1'; }catch(e){ return false; } }
    function closeSplash(){
      sp.classList.add('hide'); body.classList.remove('sp-open','sp-loading');
      setTimeout(function(){ sp.style.display='none'; },650);
    }
    if(seen()){ sp.style.display='none'; body.classList.remove('sp-open'); }
    else $('#splashGo').addEventListener('click',function(){
      if(body.classList.contains('sp-loading')) return;
      body.classList.add('sp-loading');
      setTimeout(function(){ try{ sessionStorage.setItem('skySplash','1'); }catch(e){} closeSplash(); },1700);
    });
  })();
  </script>
